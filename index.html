<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>文文的成长工作台</title>
<style>
:root {
  --bg: #f0eef5; --card: #ffffff; --text: #3d3d5c; --text2: #6b6b8a; --text3: #9a9ab3;
  --border: #e8e4f0; --primary: #9b8ec7; --primaryDark: #7a6db0; --primaryLight: #f0ecfa;
  --success: #7bc8a0; --danger: #e8919c; --warning: #f0c674; --info: #8ecae6;
  --radius: 20px; --radiusSm: 14px; --shadow: 0 4px 16px rgba(155,142,199,0.12);
  --shadowHover: 0 6px 24px rgba(155,142,199,0.18);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);overflow:hidden;}

/* ===== Layout ===== */
.app{display:flex;height:100vh;width:100vw;}

/* Sidebar */
.sidebar{width:72px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:14px 0;flex-shrink:0;z-index:10;overflow-y:auto;gap:8px;}
.sidebar::-webkit-scrollbar{display:none;}
.sidebar .logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--primary),#c4b8e0);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:10px;flex-shrink:0;box-shadow:0 2px 8px rgba(155,142,199,0.3);}
.sidebar .nav-item{width:54px;height:54px;border-radius:var(--radiusSm);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:all .2s;position:relative;color:var(--text3);font-size:9px;flex-shrink:0;}
.sidebar .nav-item .icon{font-size:20px;}
.sidebar .nav-item.active{background:var(--primaryLight);color:var(--primaryDark);font-weight:600;}
.sidebar .nav-item .badge{position:absolute;top:2px;right:2px;min-width:15px;height:15px;border-radius:8px;background:var(--danger);color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;padding:0 3px;font-weight:600;}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;}
.header{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0;}
.header .back{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text2);cursor:pointer;}
.header h1{font-size:17px;font-weight:600;}
.header .date{font-size:13px;color:var(--text3);}
.content{flex:1;overflow-y:auto;padding:14px 16px;-webkit-overflow-scrolling:touch;}
.content::-webkit-scrollbar{display:none;}

/* ===== Hero Card ===== */
.hero-card{background:linear-gradient(135deg,#b8a9d9,#9b8ec7);border-radius:var(--radius);padding:20px 18px;margin-bottom:16px;color:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.hero-card::before{content:"🌸";position:absolute;right:14px;top:14px;font-size:28px;opacity:.5;}
.hero-card::after{content:"✨";position:absolute;right:50px;bottom:10px;font-size:18px;opacity:.4;}
.hero-card .hero-title{font-size:20px;font-weight:700;margin-bottom:8px;}
.hero-card .hero-date{font-size:13px;opacity:.9;margin-bottom:12px;}
.hero-card .hero-progress{display:flex;align-items:center;gap:10px;}
.hero-card .hero-progress-bar{flex:1;height:6px;background:rgba(255,255,255,.3);border-radius:3px;overflow:hidden;}
.hero-card .hero-progress-bar .fill{height:100%;background:#fff;border-radius:3px;transition:width .4s;}
.hero-card .hero-progress-text{font-size:13px;font-weight:600;}

/* ===== Cards ===== */
.card{background:var(--card);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--border);}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.card-title .icon{font-size:18px;}

/* ===== Task Items ===== */
.task-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.task-item:last-child{border-bottom:none;padding-bottom:0;}
.task-item:first-child{padding-top:0;}
.task-check{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--border);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;background:#fff;}
.task-check.done{background:var(--success);border-color:var(--success);}
.task-check.done::after{content:"✓";color:#fff;font-size:11px;font-weight:700;}
.task-text{flex:1;font-size:14px;line-height:1.5;transition:all .15s;}
.task-text.done{text-decoration:line-through;color:var(--text3);}
.task-tag{font-size:11px;padding:3px 10px;border-radius:10px;background:var(--primaryLight);color:var(--primaryDark);flex-shrink:0;font-weight:500;}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:8px 16px;border-radius:var(--radiusSm);font-size:13px;font-weight:500;border:none;cursor:pointer;transition:all .15s;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-ghost{background:var(--primaryLight);color:var(--primaryDark);}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text2);}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-block{width:100%;}
.btn-danger{background:var(--danger);color:#fff;}

/* ===== Input ===== */
.input{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radiusSm);font-size:14px;background:var(--card);outline:none;transition:border .15s;color:var(--text);}
.input:focus{border-color:var(--primary);}
textarea.input{min-height:80px;resize:vertical;}

/* ===== Market Cards ===== */
.market-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.market-item{background:var(--card);border-radius:var(--radiusSm);padding:12px;border:1.5px solid var(--border);}
.market-item .name{font-size:12px;color:var(--text3);margin-bottom:4px;}
.market-item .value{font-size:18px;font-weight:700;}
.market-item .change{font-size:13px;margin-top:2px;font-weight:500;}
.market-item .change.up{color:var(--danger);}
.market-item .change.down{color:var(--success);}

/* ===== News List ===== */
.news-item{padding:12px 0;border-bottom:1px solid var(--border);}
.news-item:last-child{border-bottom:none;}
.news-item .title{font-size:14px;font-weight:500;line-height:1.5;margin-bottom:4px;}
.news-item .meta{font-size:12px;color:var(--text3);display:flex;gap:8px;flex-wrap:wrap;}
.news-item .tag{padding:1px 8px;border-radius:8px;background:var(--primaryLight);color:var(--primaryDark);font-size:11px;font-weight:500;}

/* ===== FAB ===== */
.fab{position:fixed;bottom:20px;right:14px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#c4b8e0);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 16px rgba(155,142,199,0.4);cursor:pointer;z-index:100;border:none;transition:transform .15s;}
.fab:active{transform:scale(0.92);}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(61,61,92,0.35);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
.modal-overlay.show{opacity:1;pointer-events:auto;}
.modal{background:var(--card);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-height:85vh;overflow-y:auto;padding:18px;transform:translateY(100%);transition:transform .25s ease-out;}
.modal-overlay.show .modal{transform:translateY(0);}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.modal-header h2{font-size:17px;font-weight:600;}
.modal-header .close{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--text2);cursor:pointer;}

/* ===== Overview ===== */
.overview-section{margin-bottom:16px;}
.overview-section .section-title{font-size:14px;font-weight:600;color:var(--primaryDark);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.overview-section .progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:8px;}
.overview-section .progress-bar .fill{height:100%;background:linear-gradient(90deg,var(--primary),#c4b8e0);border-radius:3px;transition:width .3s;}
.overview-section .summary{font-size:13px;color:var(--text2);line-height:1.6;}

/* ===== Date Picker ===== */
.date-picker{display:flex;gap:8px;overflow-x:auto;padding:4px 0;margin-bottom:12px;}
.date-picker::-webkit-scrollbar{display:none;}
.date-chip{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);font-size:13px;cursor:pointer;background:var(--card);transition:all .15s;}
.date-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}

/* ===== Month Picker ===== */
.month-picker{display:flex;gap:6px;overflow-x:auto;padding:4px 0;margin-bottom:12px;}
.month-picker::-webkit-scrollbar{display:none;}
.month-chip{flex-shrink:0;padding:6px 12px;border-radius:16px;border:1.5px solid var(--border);font-size:12px;cursor:pointer;background:var(--card);transition:all .15s;}
.month-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}

/* ===== Section Divider ===== */
.section-divider{display:flex;align-items:center;gap:10px;margin:16px 0 12px;font-size:13px;color:var(--text3);font-weight:500;}
.section-divider::before,.section-divider::after{content:"";flex:1;height:1px;background:var(--border);}

/* ===== Add Row ===== */
.add-row{display:flex;gap:8px;margin-top:10px;}
.add-row .input{flex:1;}

/* ===== Empty State ===== */
.empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:14px;}
.empty .icon{font-size:40px;margin-bottom:8px;display:block;}

/* ===== Note Box ===== */
.note-box{background:#fef9f0;border-left:3px solid var(--warning);padding:10px 12px;border-radius:0 var(--radiusSm) var(--radiusSm) 0;font-size:13px;color:var(--text2);margin-top:8px;}

/* ===== Video Card ===== */
.video-card{background:var(--card);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow);border-left:3px solid var(--danger);border:1.5px solid var(--border);}
.video-card .v-header{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.video-card .v-title{font-weight:600;font-size:14px;flex:1;padding-right:8px;}
.video-card .v-heat{font-size:12px;color:var(--danger);font-weight:600;flex-shrink:0;}
.video-card .v-author{font-size:11px;color:var(--text3);}
.video-card .v-info-card{padding:12px 16px;border-bottom:1px solid var(--border);}
.video-card .v-info-card:last-child{border-bottom:none;}
.video-card .v-info-title{font-size:13px;font-weight:600;margin-bottom:6px;color:var(--primaryDark);display:flex;align-items:center;gap:4px;}
.video-card .v-info-item{font-size:12px;color:var(--text2);line-height:1.7;padding:3px 0;display:flex;gap:6px;}
.video-card .v-info-item .bullet{color:var(--primary);flex-shrink:0;}
.video-card .v-link{padding:10px 16px;text-align:center;border-top:1px solid var(--border);}
.video-card .v-link a{color:var(--primaryDark);font-size:13px;text-decoration:none;font-weight:500;}

/* ===== Finance News ===== */
.finance-news-item{padding:14px 0;border-bottom:1px solid var(--border);}
.finance-news-item:last-child{border-bottom:none;}
.finance-news-item .fn-title{font-size:14px;font-weight:600;line-height:1.5;margin-bottom:6px;}
.finance-news-item .fn-source{font-size:11px;color:var(--text3);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.finance-news-item .fn-impact{padding:8px 12px;border-radius:10px;font-size:12px;line-height:1.6;margin-bottom:6px;}
.fn-impact.positive{background:#f0fdf4;color:#065f46;border-left:3px solid var(--success);}
.fn-impact.negative{background:#fef2f2;color:#991b1b;border-left:3px solid var(--danger);}
.fn-impact.neutral{background:#f8fafc;color:#475569;border-left:3px solid var(--text3);}
.fn-note-toggle{font-size:12px;color:var(--primaryDark);cursor:pointer;margin-top:4px;display:inline-block;}
.fn-note-area{margin-top:8px;display:none;}
.fn-note-area.open{display:block;}
.fn-priority-badge{font-size:10px;padding:2px 8px;border-radius:8px;font-weight:600;}
.fn-priority-badge.high{background:#fef2f2;color:var(--danger);}
.fn-priority-badge.mid{background:#fef9f0;color:var(--warning);}
.fn-priority-badge.low{background:#f8fafc;color:var(--text3);}

/* ===== Review Template ===== */
.review-section-card{background:var(--card);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);border:1.5px solid var(--border);}
.review-section-card .rs-title{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.review-section-card textarea.input{min-height:60px;}
.review-section-card .field-row{display:flex;gap:8px;margin-bottom:8px;}
.review-section-card .field-row .input{flex:1;}
.review-section-card .field-label{font-size:12px;color:var(--text3);margin-bottom:4px;}

/* ===== Savings ===== */
.savings-overview{background:linear-gradient(135deg,#b8a9d9,#9b8ec7);border-radius:var(--radius);padding:18px;margin-bottom:14px;color:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.savings-overview::before{content:"💰";position:absolute;right:14px;top:10px;font-size:32px;opacity:.3;}
.savings-overview .so-row{display:flex;justify-content:space-between;margin-bottom:10px;}
.savings-overview .so-label{font-size:12px;opacity:.85;}
.savings-overview .so-value{font-size:20px;font-weight:700;}
.savings-overview .so-goal{font-size:13px;opacity:.9;}
.savings-progress{height:8px;background:rgba(255,255,255,.3);border-radius:4px;margin:12px 0 4px;overflow:hidden;}
.savings-progress .fill{height:100%;background:#fff;border-radius:4px;transition:width .4s;}
.savings-gap{font-size:12px;opacity:.85;text-align:right;}
.expense-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);}
.expense-item:last-child{border-bottom:none;}
.expense-item .exp-cat{font-size:11px;padding:3px 10px;border-radius:10px;font-weight:500;}
.exp-cat.food{background:#fef3c7;color:#b45309;}
.exp-cat.shopping{background:#fce7f3;color:#be185d;}
.exp-cat.transport{background:#e0e7ff;color:#4338ca;}
.exp-cat.home{background:#d1fae5;color:#065f46;}
.exp-cat.other{background:#f1f5f9;color:#475569;}
.expense-item .exp-name{flex:1;font-size:14px;margin:0 10px;}
.expense-item .exp-amt{font-weight:600;color:var(--danger);}
.expense-item .deposit-amt{font-weight:600;color:var(--success);}
.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px;}
.stat-box{background:var(--card);border-radius:var(--radiusSm);padding:12px;text-align:center;border:1.5px solid var(--border);}
.stat-box .stat-label{font-size:11px;color:var(--text3);margin-bottom:4px;}
.stat-box .stat-value{font-size:16px;font-weight:700;}
.stat-box .stat-value.red{color:var(--danger);}
.stat-box .stat-value.green{color:var(--success);}
.stat-box .stat-value.primary{color:var(--primaryDark);}

/* ===== Routine ===== */
.routine-period{margin-bottom:18px;}
.routine-period .rp-header{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.routine-period .rp-time{font-size:12px;color:var(--text3);font-weight:400;}
.routine-task{padding:10px 0;border-bottom:1px solid var(--border);}
.routine-task:last-child{border-bottom:none;}
.routine-task .rt-row{display:flex;align-items:center;gap:10px;}
.routine-task .rt-time{font-size:11px;color:var(--text3);width:42px;flex-shrink:0;}
.routine-task .rt-text{flex:1;font-size:13px;line-height:1.4;}
.routine-task .rt-tag{font-size:10px;padding:2px 8px;border-radius:8px;background:var(--primaryLight);color:var(--primaryDark);flex-shrink:0;margin-left:4px;font-weight:500;}
.week-chart{display:flex;align-items:flex-end;gap:8px;height:100px;padding:0 4px;}
.week-chart .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;}
.week-chart .bar{width:100%;border-radius:8px 8px 0 0;background:var(--primary);transition:height .4s;min-height:4px;max-height:88px;}
.week-chart .bar-label{font-size:10px;color:var(--text3);}
.week-chart .bar-pct{font-size:10px;color:var(--primaryDark);font-weight:600;}

/* ===== Responsive ===== */
@media(min-width:768px){body{max-width:430px;margin:0 auto;border-left:1px solid var(--border);border-right:1px solid var(--border);}.fab{right:calc(50% - 195px);}}
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar">
    <div class="logo">🐱</div>
    <div class="nav-item active" data-page="plan" onclick="switchPage('plan')"><span class="icon">📋</span><span>计划</span></div>
    <div class="nav-item" data-page="videos" onclick="switchPage('videos')"><span class="icon">🎬</span><span>爆款</span><span class="badge">3</span></div>
    <div class="nav-item" data-page="hot" onclick="switchPage('hot')"><span class="icon">🔥</span><span>灵感</span></div>
    <div class="nav-item" data-page="finnews" onclick="switchPage('finnews')"><span class="icon">💹</span><span>财经</span><span class="badge">7</span></div>
    <div class="nav-item" data-page="review" onclick="switchPage('review')"><span class="icon">📈</span><span>复盘</span></div>
    <div class="nav-item" data-page="savings" onclick="switchPage('savings')"><span class="icon">🐷</span><span>存钱</span></div>
    <div class="nav-item" data-page="routine" onclick="switchPage('routine')"><span class="icon">🏠</span><span>作息</span></div>
  </nav>
  <div class="main">
    <div class="header">
      <div class="back" onclick="goBack()" id="backBtn" style="visibility:hidden">‹</div>
      <h1 id="pageTitle">每日计划</h1>
      <div class="date" id="headerDate"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<button class="fab" onclick="openOverview()">🌸</button>

<div class="modal-overlay" id="overviewModal" onclick="closeOverview(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header"><h2>🌸 今日总览</h2><div class="close" onclick="closeOverview()">✕</div></div>
    <div id="overviewContent"></div>
  </div>
</div>

<script>
// ===================== DATA STORE =====================
const Store = {
  key: (type, date) => `wb_${type}_${date}`,
  today: () => new Date().toISOString().slice(0,10),
  get(type, date) { const r = localStorage.getItem(this.key(type, date)); return r ? JSON.parse(r) : null; },
  set(type, date, data) { localStorage.setItem(this.key(type, date), JSON.stringify(data)); },
  getDates(type) {
    const dates = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(`wb_${type}_`)) dates.push(k.replace(`wb_${type}_`, ''));
    }
    return dates.sort().reverse();
  }
};

// ===================== GENERATORS =====================
const Generators = {
  plan(date) {
    return {
      tasks: [
        { id:1, text:"构思今日1条枕头/家居好物文案主题", done:false, tag:"文案",
          detail:{
            title:"今日文案主题：换了枕头才知道以前白睡了",
            script:[
              "【开头钩子（0-3秒）】镜头对准旧枕头，旁白：'你家枕头用了几年了？看到这个颜色你还敢睡吗？'",
              "【痛点引入（3-8秒）】展示旧枕头发黄、变形的画面，旁白：'脖子酸、睡不好、越睡越累……可能不是你身体的问题，是枕头该换了。'",
              "【产品展示（8-15秒）】拿起新枕头按压回弹，旁白：'换了这个枕头第一天，脖子不酸了，整个人像被托住一样，才知道以前白睡了。'",
              "【使用对比（15-25秒）】分屏对比旧枕头vs新枕头睡眠姿势，旁白：'左边塌陷严重，右边稳稳托住颈椎，差别一眼就能看出来。'",
              "【引导转化（25-30秒）】展示产品细节+价格标签，旁白：'不到一杯奶茶钱，枕头这东西真的不能将就。链接在主页，先到先得。'"
            ],
            tips:[
              "文案口语化，像和朋友聊天，不要播音腔",
              "多用'你'拉近距离，少用'我们''大家'",
              "价格用生活化的参照物（奶茶、外卖）对比",
              "结尾制造紧迫感：先到先得/限时/少量库存"
            ]

// ===================== STATE =====================
let currentPage = 'plan';
let currentDate = Store.today();
let viewingDate = currentDate;
let savingsViewMonth = new Date().toISOString().slice(0,7);

// ===================== NAVIGATION =====================
function switchPage(page, date) {
  currentPage = page;
  viewingDate = date || currentDate;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page === page));
  const titles = { plan:'每日计划', videos:'低粉爆款视频', hot:'爆款灵感', finnews:'财经重要新闻', review:'市场收盘', dayreview:'基金复盘', savings:'我的账户', routine:'居家作息' };
  document.getElementById('pageTitle').textContent = titles[page] || page;
  document.getElementById('backBtn').style.visibility = (date && date !== currentDate) ? 'visible' : 'hidden';
  document.getElementById('headerDate').textContent = viewingDate;
  renderPage(page, viewingDate);
}
function goBack() { viewingDate = currentDate; switchPage(currentPage); }

// ===================== RENDERERS =====================
function renderPage(page, date) {
  const el = document.getElementById('content');
  let data = Store.get(page, date);
  if (!data && Generators[page]) { data = Generators[page](date); Store.set(page, date, data); }
  const isHistory = date !== currentDate;
  const readonly = isHistory;
  switch(page) {
    case 'plan': renderPlan(el, data, readonly, date); break;
    case 'videos': renderVideos(el, data, readonly, date); break;
    case 'hot': renderHot(el, data, readonly, date); break;
    case 'finnews': renderFinNews(el, data, readonly, date); break;
    case 'review': renderReview(el, data, readonly, date); break;
    case 'dayreview': renderDayReview(el, data, readonly, date); break;
    case 'savings': renderSavings(el, data, readonly, date); break;
    case 'routine': renderRoutine(el, data, readonly, date); break;
  }
  if (isHistory) renderDatePicker(el, page, date);
}
function renderDatePicker(el, page, current) {
  const dates = Store.getDates(page);
  if (dates.length <= 1) return;
  el.insertAdjacentHTML('afterbegin', `<div class="date-picker">${dates.map(d => `<div class="date-chip ${d===current?'active':''}" onclick="switchPage('${page}','${d}')">${d.slice(5)}</div>`).join('')}</div>`);
}

  el.innerHTML = `

      <div class="hero-date">${date} ${weekDay}</div>

// 任务详情展开渲染
function renderTaskDetail(detail) {
  let html = '';
  // 文案类型（有 script 数组）
  if (detail.script) {
    html += `<div style="font-size:13px;font-weight:600;color:var(--primaryDark);margin-bottom:8px;">📝 ${detail.title}</div>`;
    html += detail.script.map((s, i) => `
      <div style="background:var(--primaryLight);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px;line-height:1.6;color:var(--text);">
        ${s}
      </div>`).join('');
    if (detail.tips) {
      html += `<div style="font-size:12px;font-weight:600;color:var(--warning);margin-top:10px;margin-bottom:4px;">💡 文案小贴士</div>`;
      html += detail.tips.map(t => `<div style="font-size:12px;color:var(--text2);line-height:1.7;padding:3px 0;display:flex;gap:6px;"><span>·</span><span>${t}</span></div>`).join('');
    }
  }
  // 拍摄类型（有 shots 数组）
  if (detail.shots) {
    html += `<div style="font-size:13px;font-weight:600;color:var(--primaryDark);margin-bottom:8px;">📷 ${detail.title}</div>`;
    html += detail.shots.map((s, i) => `
      <div style="background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
          <span style="width:20px;height:20px;border-radius:50%;background:var(--primary);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0;">${i+1}</span>
          <span style="font-size:13px;font-weight:600;">${s.name}</span>
        </div>
        <div style="font-size:12px;color:var(--text2);line-height:1.6;padding-left:26px;">${s.desc}</div>
        <div style="font-size:11px;color:var(--warning);padding-left:26px;margin-top:4px;">💡 ${s.tip}</div>

function renderRoutine(el, data, readonly, date) {
  const periods = {
    morning: { icon:'🌅', name:'上午', time:'08:00 - 12:00' },
    afternoon: { icon:'☀️', name:'下午', time:'13:00 - 17:00' },
    evening: { icon:'🌙', name:'晚间', time:'18:00 - 23:00' }
  };
  const doneCount = data.tasks.filter(t => t.done).length;
  const totalCount = data.tasks.length;
  const pct = Math.round(doneCount / totalCount * 100);
  const periodHTML = Object.entries(periods).map(([key, p]) => {
    const tasks = data.tasks.filter(t => t.period === key);
    return `<div class="routine-period">
      <div class="rp-header">${p.icon} ${p.name} <span class="rp-time">${p.time}</span></div>
      <div class="card">${tasks.map(t => `
        <div class="routine-task">
          <div class="rt-row">
            <span class="rt-time">${t.time}</span>
            <div class="task-check ${t.done?'done':''}" ${readonly?'':'onclick="toggleRoutineTask('+t.id+')"'}></div>
            <span class="rt-text" style="${t.done?'text-decoration:line-through;color:var(--text3);':''}">${t.text}</span>
            <span class="rt-tag">${t.tag}</span>
          </div>
        </div>`).join('')}</div>
    </div>`;
  }).join('');
  const weekChartHTML = buildWeekChart(date);
  el.innerHTML = `
    <div class="hero-card">
      <div class="hero-title">居家作息表</div>
      <div class="hero-date">今日完成 ${doneCount}/${totalCount}（${pct}%）</div>
      <div class="hero-progress">
        <div class="hero-progress-bar"><div class="fill" style="width:${pct}%"></div></div>
        <div class="hero-progress-text">${pct}%</div>
      </div>
    </div>
    ${periodHTML}
    <div class="card"><div class="card-title"><span class="icon">📊</span> 本周每日完成率</div>
      ${weekChartHTML}
    </div>
    ${readonly ? '<div class="note-box">📌 历史归档内容仅可查看，不可编辑</div>' : ''}`;
}
function buildWeekChart(date) {
  const d = new Date(date);
  const dayOfWeek = d.getDay() || 7;
  const monday = new Date(d);
  monday.setDate(d.getDate() - dayOfWeek + 1);
  const days = ['一','二','三','四','五','六','日'];
  let bars = '';
  for (let i = 0; i < 7; i++) {
    const cd = new Date(monday);
    cd.setDate(monday.getDate() + i);
    const dateStr = cd.toISOString().slice(0,10);
    const rd = Store.get('routine', dateStr);
    let pct = 0;
    if (rd && rd.tasks) {
      const done = rd.tasks.filter(t => t.done).length;
      pct = Math.round(done / rd.tasks.length * 100);
    }
    const isToday = dateStr === Store.today();
    bars += `<div class="bar-col">
      <div class="bar-pct">${pct}%</div>
      <div class="bar" style="height:${Math.max(4,pct/100*88)}px;background:${isToday?'var(--primary)':'var(--primaryLight)'};"></div>
      <div class="bar-label">${days[i]}</div>
    </div>`;
  }
  return `<div class="week-chart">${bars}</div>`;
}
function toggleRoutineTask(id) {
  const data = Store.get('routine', viewingDate);
  const task = data.tasks.find(t => t.id === id);
  if (task) { task.done = !task.done; Store.set('routine', viewingDate, data); renderPage('routine', viewingDate); }
}

}

// ===================== ACTIONS =====================
function toggleTask(page, section, id) { const d = Store.get(page, viewingDate); const it = d[section].find(x => x.id === id); if (it) { it.done = !it.done; Store.set(page, viewingDate, d); renderPage(page, viewingDate); } }
function updateReviewNote(val) { const d = Store.get('review', viewingDate); d.note = val; Store.set('review', viewingDate, d); }

// ===================== OVERVIEW =====================
function openOverview() {
  const modal = document.getElementById('overviewModal');
  const content = document.getElementById('overviewContent');
  const date = viewingDate;
  const plan = Store.get('plan', date) || {};
  const videos = Store.get('videos', date) || {};
  const finnews = Store.get('finnews', date) || {};
  const dayreview = Store.get('dayreview', date) || {};
  const savings = Store.get('savings', date) || {};
  const routine = Store.get('routine', date) || {};
  const planDone = plan.tasks ? plan.tasks.filter(t=>t.done).length : 0;
  const planTotal = plan.tasks ? plan.tasks.length : 0;
  const growthDone = plan.growth ? plan.growth.filter(t=>t.done).length : 0;
  const growthTotal = plan.growth ? plan.growth.length : 0;
  const finDone = finnews.items ? finnews.items.filter(i=>i.userNote).length : 0;
  const finTotal = finnews.items ? finnews.items.length : 0;
  const routineDone = routine.tasks ? routine.tasks.filter(t=>t.done).length : 0;
  const routineTotal = routine.tasks ? routine.tasks.length : 0;
  const todayExpense = (savings.expenses||[]).reduce((s,e) => s + (e.amount||0), 0);
  const todayDeposit = (savings.deposits||[]).reduce((s,d) => s + (d.amount||0), 0);
  const html = `
    <div class="overview-section"><div class="section-title">📋 每日计划</div><div class="progress-bar"><div class="fill" style="width:${planTotal+growthTotal?((planDone+growthDone)/(planTotal+growthTotal)*100):0}%"></div></div><div class="summary">基础 ${planDone}/${planTotal} · 成长 ${growthDone}/${growthTotal}</div></div>
    <div class="overview-section"><div class="section-title">🎬 低粉爆款视频</div><div class="summary">今日采集 ${videos.list?videos.list.length:0} 条</div></div>
    <div class="overview-section"><div class="section-title">💹 财经新闻</div><div class="progress-bar"><div class="fill" style="width:${finTotal?(finDone/finTotal*100):0}%"></div></div><div class="summary">${finTotal}条 · ${finDone}条已批注</div></div>
    <div class="overview-section"><div class="section-title">📈 基金复盘</div><div class="summary">${dayreview.summary?'已填写':'待填写'} · ${dayreview._savedAt?'已保存':'未保存'}</div></div>
    <div class="overview-section"><div class="section-title">🏦 存款账户</div><div class="summary">今日消费 ¥${todayExpense} · 存款 ¥${todayDeposit}</div></div>
    <div class="overview-section"><div class="section-title">🏠 居家作息</div><div class="progress-bar"><div class="fill" style="width:${routineTotal?(routineDone/routineTotal*100):0}%"></div></div><div class="summary">${routineDone}/${routineTotal} 项已完成</div></div>
  `;
  content.innerHTML = html;
  modal.classList.add('show');
}
function closeOverview(e) { if (!e || e.target === document.getElementById('overviewModal')) document.getElementById('overviewModal').classList.remove('show'); }

// ===================== INIT =====================
function init() {
  document.getElementById('headerDate').textContent = currentDate;
  ['plan','videos','hot','finnews','review','dayreview','savings','routine'].forEach(type => {
    if (!Store.get(type, currentDate)) Store.set(type, currentDate, Generators[type](currentDate));
  });
  switchPage('plan');
}
init();
</script>
</body>
</html>
